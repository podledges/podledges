<svg xmlns="http://www.w3.org/2000/svg" width="860" height="920" viewBox="0 0 860 920" role="img" aria-labelledby="title desc">
  <title id="title">PodleHub Hardline Signal Deck profile concept</title>
  <desc id="desc">A stark black, white, and orange PodleHub wordmark above the existing neon streak and commit analyzer panels. The analyzer uses compact hot-window, private-data, and current-time annotations.</desc>
  <defs>
    <linearGradient id="deck-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05060a"/>
      <stop offset=".58" stop-color="#09111b"/>
      <stop offset="1" stop-color="#15091d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2ee9ff"/>
      <stop offset=".5" stop-color="#ccff5e"/>
      <stop offset="1" stop-color="#ff2ec8"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2ee9ff"/>
      <stop offset=".55" stop-color="#ff2ec8"/>
      <stop offset="1" stop-color="#ccff5e"/>
    </linearGradient>
    <pattern id="grid" width="68" height="52" patternUnits="userSpaceOnUse">
      <path d="M68 0H0V52" fill="none" stroke="#2ee9ff" stroke-opacity=".11"/>
    </pattern>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="940" height="1000">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wave-clip"><rect x="170" y="616" width="648" height="228" rx="4"/></clipPath>
    <style>
      :root{color-scheme:dark}
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .scan{animation:scan 4.2s linear infinite}
      .blink{animation:blink 1.1s steps(1) infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .dash{stroke-dasharray:9 12;animation:dash 2.4s linear infinite}
      .hot{animation:hot 1.8s ease-in-out infinite}
      @keyframes scan{from{transform:translateX(-210px)}to{transform:translateX(1080px)}}
      @keyframes blink{50%{opacity:.2}}
      @keyframes pulse{50%{opacity:.52}}
      @keyframes dash{to{stroke-dashoffset:-42}}
      @keyframes hot{50%{fill-opacity:.2;stroke-opacity:1}}
      @media (prefers-reduced-motion:reduce){.scan,.blink,.pulse,.dash,.hot{animation:none!important}}
    </style>
  </defs>

  <!-- Stark wordmark panel -->
  <rect width="860" height="188" fill="#050505"/>
  <rect x="1" y="1" width="858" height="186" fill="none" stroke="#ffffff" stroke-opacity=".4"/>
  <rect x="0" y="0" width="14" height="188" fill="#ff5a1f"/>
  <path d="M38 34H822M38 154H822" stroke="#ffffff" stroke-opacity=".28"/>
  <text x="42" y="28" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="3">PODLEHUB</text>
  <text x="818" y="28" text-anchor="end" fill="#ff5a1f" font-size="10" font-weight="800" letter-spacing="2">OPEN LIVE ↗</text>
  <text x="42" y="127" fill="#ffffff" font-family="Arial Black,Impact,sans-serif" font-size="78" font-weight="900" letter-spacing="-5">PODLE</text>
  <rect x="524" y="58" width="294" height="84" fill="#ff5a1f"/>
  <text x="671" y="127" text-anchor="middle" fill="#050505" font-family="Arial Black,Impact,sans-serif" font-size="78" font-weight="900" letter-spacing="-5">HUB</text>
  <rect class="scan" x="-180" y="38" width="150" height="112" fill="url(#signal)" opacity=".12" transform="skewX(-16)"/>
  <rect class="blink" x="810" y="162" width="8" height="8" fill="#ffffff"/>

  <!-- Existing neon instrument bay, compressed under the wordmark -->
  <g transform="translate(0 208)">
    <rect x="1" y="1" width="858" height="278" rx="14" fill="url(#deck-bg)" stroke="#2ee9ff" stroke-opacity=".34"/>
    <circle cx="26" cy="27" r="5" fill="#2ee9ff" filter="url(#glow)"/>
    <text x="42" y="31" fill="#e8f4ff" font-size="11" font-weight="800" letter-spacing="2.5">PODLESTREAK</text>
    <text x="836" y="31" text-anchor="end" fill="#9bb0c6" font-size="9" letter-spacing="1.3">LIVE CONTRIBUTION CALENDAR</text>
    <line x1="22" y1="48" x2="838" y2="48" stroke="#88d6ff" stroke-opacity=".18"/>
    <rect x="22" y="66" width="522" height="184" rx="10" fill="#080c13" stroke="#2ee9ff" stroke-opacity=".25"/>
    <text x="48" y="136" fill="#ffffff" font-family="Arial Black,Impact,sans-serif" font-size="68" font-weight="900">37</text>
    <text x="147" y="136" fill="#2ee9ff" font-size="23" font-weight="900" letter-spacing="2">DAYS</text>
    <text x="48" y="159" fill="#9bb0c6" font-size="10" letter-spacing="1.8">CURRENT DAILY CONTRIBUTION STREAK</text>
    <g transform="translate(48 183)">
      <text y="10" fill="#ccff5e" font-size="9" font-weight="800" letter-spacing="1.5">PODLEWEEK</text>
      <g transform="translate(116 0)" fill="#2ee9ff" filter="url(#glow)">
        <rect x="0" y="3" width="34" height="17" rx="2"/>
        <rect x="45" y="-7" width="34" height="27" rx="2"/>
        <rect x="90" y="10" width="34" height="10" rx="2"/>
        <rect x="135" y="-3" width="34" height="23" rx="2"/>
        <rect x="180" y="0" width="34" height="20" rx="2"/>
        <rect x="225" y="-28" width="34" height="48" rx="2" fill="#ff2ec8"/>
        <rect x="270" y="-22" width="34" height="42" rx="2" fill="#ccff5e"/>
      </g>
      <text x="116" y="40" fill="#74899c" font-size="8" letter-spacing="24">T W T F S S M</text>
    </g>
    <rect x="562" y="66" width="276" height="184" rx="10" fill="#130d15" stroke="#ff2ec8" stroke-opacity=".36" stroke-dasharray="6 7"/>
    <text x="586" y="94" fill="#ffb347" font-size="10" font-weight="800" letter-spacing="2">PODLE BAY</text>
    <text x="586" y="150" fill="#e8f4ff" font-size="29" font-weight="900" letter-spacing="2">OPEN</text>
    <text x="586" y="172" fill="#9bb0c6" font-size="9" letter-spacing="1">NEXT MODULE DOCK</text>
    <path class="pulse" d="M586 211H812" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Commit analyzer with compact annotations -->
  <g>
    <rect x="1" y="508" width="858" height="410" rx="14" fill="url(#deck-bg)" stroke="#ccff5e" stroke-opacity=".32"/>
    <circle cx="26" cy="535" r="5" fill="#ccff5e" filter="url(#glow)"/>
    <text x="42" y="539" fill="#e8f4ff" font-size="11" font-weight="800" letter-spacing="2.5">COMMIT ANALYZER</text>
    <text x="836" y="539" text-anchor="end" fill="#9bb0c6" font-size="9" letter-spacing="1.3">8W · 717 COMMITS · 22 REPOS</text>
    <line x1="22" y1="556" x2="838" y2="556" stroke="#88d6ff" stroke-opacity=".18"/>
    <rect x="170" y="584" width="648" height="260" fill="url(#grid)"/>
    <rect class="hot" x="700" y="584" width="118" height="260" fill="#ff5a1f" fill-opacity=".09" stroke="#ff5a1f" stroke-opacity=".68"/>
    <path d="M700 574V565H818V574" fill="none" stroke="#ff5a1f" stroke-width="2"/>
    <rect x="705" y="551" width="108" height="22" rx="2" fill="#ff5a1f"/>
    <text x="759" y="566" text-anchor="middle" fill="#050505" font-size="9" font-weight="900" letter-spacing="1">HOT 7D · 155</text>

    <text x="22" y="610" fill="#7b93a8" font-size="9">CH0</text>
    <text x="54" y="610" fill="#ffb347" font-size="9" font-weight="800">PRIVATE</text>
    <text x="118" y="610" fill="#ccff5e" font-size="9">+420</text>
    <text x="22" y="662" fill="#7b93a8" font-size="9">CH1</text>
    <text x="54" y="662" fill="#ffb347" font-size="9" font-weight="800">PRIVATE</text>
    <text x="118" y="662" fill="#ccff5e" font-size="9">+91</text>
    <text x="22" y="714" fill="#7b93a8" font-size="9">CH2</text>
    <text x="54" y="714" fill="#7fd0f5" font-size="9" font-weight="800">PODLEWINDOWS</text>
    <text x="135" y="714" fill="#ccff5e" font-size="9">+52</text>
    <text x="22" y="766" fill="#7b93a8" font-size="9">CH3</text>
    <text x="54" y="766" fill="#ffb347" font-size="9" font-weight="800">PRIVATE</text>
    <text x="118" y="766" fill="#ccff5e" font-size="9">+28</text>
    <text x="22" y="818" fill="#7b93a8" font-size="9">CH4</text>
    <text x="54" y="818" fill="#7fd0f5" font-size="9" font-weight="800">PODLEHUB</text>
    <text x="118" y="818" fill="#ccff5e" font-size="9">+17</text>

    <g clip-path="url(#wave-clip)" fill="none" stroke-linejoin="round" filter="url(#glow)">
      <path class="dash" d="M170 628H210V606H252V628H310V606H343V628H412V606H473V628H528V606H571V628H620V606H666V628H714V606H747V628H818" stroke="#ff54a8" stroke-width="2.4"/>
      <path class="dash" d="M170 680H288V658H346V680H522V658H575V680H744V658H788V680H818" stroke="#ff54a8" stroke-width="2.4"/>
      <path class="dash" d="M170 732H410V710H456V732H604V710H651V732H717V710H763V732H818" stroke="#2ee9ff" stroke-width="2.4"/>
      <path class="dash" d="M170 784H538V762H581V784H701V762H748V784H818" stroke="#ccff5e" stroke-width="2.4"/>
      <path class="dash" d="M170 836H616V814H666V836H733V814H782V836H818" stroke="#7fd0f5" stroke-width="2.4"/>
    </g>
    <line x1="818" y1="580" x2="818" y2="849" stroke="#ffffff" stroke-opacity=".8" stroke-dasharray="2 5"/>
    <rect x="791" y="855" width="47" height="18" rx="2" fill="#ffffff"/>
    <text x="814.5" y="868" text-anchor="middle" fill="#050505" font-size="8" font-weight="900" letter-spacing="1">NOW</text>
    <g transform="translate(22 882)">
      <rect width="8" height="8" fill="#ffb347"/>
      <text x="14" y="8" fill="#9bb0c6" font-size="8" letter-spacing="1">PRIVATE NAMES MASKED</text>
      <rect x="154" width="8" height="8" fill="#ff5a1f"/>
      <text x="168" y="8" fill="#9bb0c6" font-size="8" letter-spacing="1">HOT WINDOW</text>
      <rect x="266" width="8" height="8" fill="#ffffff"/>
      <text x="280" y="8" fill="#9bb0c6" font-size="8" letter-spacing="1">CURRENT EDGE</text>
      <text x="816" y="8" text-anchor="end" fill="#ccff5e" font-size="8" font-weight="800" letter-spacing="1">OPEN LIVE DECK ↗</text>
    </g>
  </g>
</svg>
