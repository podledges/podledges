<svg xmlns="http://www.w3.org/2000/svg" width="860" height="446" viewBox="0 0 860 446" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Commit waveform</title>
  <desc id="desc">Static neon timing diagram of recent repository commits across eight weeks, including private repositories and a highlighted period of 144 commits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05060a"/><stop offset=".58" stop-color="#09111b"/><stop offset="1" stop-color="#15091d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="860" height="446" rx="16" fill="url(#bg)" stroke="#ccff5e" stroke-opacity=".28"/>
  <g>
    <text x="22" y="31" font-size="12" font-weight="800" letter-spacing="3"><tspan fill="#e8f4ff">PODLEHUB</tspan><tspan fill="#ccff5e">  /  COMMIT WAVEFORM</tspan></text>
    <text x="838" y="31" text-anchor="end" fill="#9fb3ca" font-size="10" letter-spacing="1">RECENT REPOSITORIES · 8-WEEK WINDOW</text>
    <line x1="22" y1="48" x2="838" y2="48" stroke="#88d6ff" stroke-opacity=".18"/>
    <rect x="634" y="68" width="64" height="321" fill="#ffb347" fill-opacity=".08"/>
    <line x1="634" y1="68" x2="634" y2="389" stroke="#ffb347" stroke-opacity=".55" stroke-dasharray="3 4"/>
    <line x1="698" y1="68" x2="698" y2="389" stroke="#ffb347" stroke-opacity=".55" stroke-dasharray="3 4"/>
    <text x="666" y="61" text-anchor="middle" fill="#fff4d8" font-size="10" font-weight="800">🔥🔥144 commits 🥵🥵</text>
    <g stroke="#2e5165" stroke-opacity=".5" stroke-dasharray="2 5"><path d="M22 74V389M124 74V389M226 74V389M328 74V389M430 74V389M532 74V389M736 74V389M838 74V389"/></g>
    <g font-size="11" font-weight="800" letter-spacing="1">
      <text x="22" y="96"><tspan fill="#7b93a8">CH0</tspan><tspan dx="8" fill="#f5b043">&lt;PRIVATE🔒&gt;</tspan></text>
      <text x="22" y="155"><tspan fill="#7b93a8">CH1</tspan><tspan dx="8" fill="#7fd0f5">SWAP-CALCULATOR</tspan></text>
      <text x="22" y="214"><tspan fill="#7b93a8">CH2</tspan><tspan dx="8" fill="#7fd0f5">PODLES-FIRSTMATE</tspan></text>
      <text x="22" y="273"><tspan fill="#7b93a8">CH3</tspan><tspan dx="8" fill="#ccff5e">PODLEDGES</tspan></text>
      <text x="22" y="332"><tspan fill="#7b93a8">CH4</tspan><tspan dx="8" fill="#f5b043">&lt;PRIVATE🔒&gt;</tspan></text>
    </g>
    <g fill="none" stroke-linejoin="round" stroke-width="2">
      <path d="M170 130H286v-24h24v24h42v-24h28v24h70v-24h28v24h78v-24h28v24h46v-24h24v24h62" stroke="#ff54a8"/>
      <path d="M170 189h36v-24h30v24h62v-24h30v24h100v-24h28v24h130v-24h34v24h58" stroke="#7fd0f5"/>
      <path d="M170 248h164v-24h28v24h144v-24h30v24h100v-24h28v24h42" stroke="#7fd0f5"/>
      <path d="M170 307h360v-24h30v24h58v-24h30v24h110" stroke="#ccff5e"/>
      <path d="M170 366h300v-24h30v24h44v-24h30v24h154" stroke="#ff54a8"/>
    </g>
    <line x1="666" y1="68" x2="666" y2="389" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#46586a" stroke-opacity=".7"><path d="M22 400H838"/><path d="M22 396v8M124 396v8M226 396v8M328 396v8M430 396v8M532 396v8M634 396v8M736 396v8M838 396v8"/></g>
    <g fill="#b3c8d8" font-size="10" text-anchor="middle"><text x="22" y="420">W-8</text><text x="124" y="420">W-7</text><text x="226" y="420">W-6</text><text x="328" y="420">W-5</text><text x="430" y="420">W-4</text><text x="532" y="420">W-3</text><text x="634" y="420">W-2</text><text x="736" y="420">W-1</text><text x="838" y="420">NOW</text></g>
  </g>
