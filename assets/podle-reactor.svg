<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="title desc">
  <title id="title">Podle Reactor Core Bay</title>
  <desc id="desc">A neon console showing a 47-day record commit streak beside an empty Podle Bay module, with a seven-day activity footer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080d"/><stop offset="1" stop-color="#10151f"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2ee9ff"/><stop offset=".55" stop-color="#ff2ec8"/><stop offset="1" stop-color="#2ee9ff"/></linearGradient>
    <linearGradient id="number" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".4" stop-color="#2ee9ff"/><stop offset=".7" stop-color="#ff2ec8"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff2ec8"/><stop offset=".5" stop-color="#2ee9ff"/><stop offset="1" stop-color="#ff2ec8"/></linearGradient>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="16" height="16" fill="#171018"/><rect width="8" height="16" fill="#2c1d12" fill-opacity=".6"/></pattern>
    <filter id="glow-cyan" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1260" height="790"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1260" height="790"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="860" height="390" rx="16" fill="url(#bg)" stroke="#263746"/>
  <rect x="1" y="1" width="858" height="388" rx="15" fill="none" stroke="#ff2ec8" stroke-opacity=".18"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="24" cy="25" r="5" fill="#ff2ec8" filter="url(#glow-pink)"/>
    <text x="40" y="29" fill="#8ea0b8" font-size="11" font-weight="700" letter-spacing="2">PODLEHUB</text>
    <text x="838" y="29" fill="#2ee9ff" font-size="11" font-weight="700" text-anchor="end" letter-spacing="2">PODLE REACTOR</text>
    <line x1="22" y1="48" x2="838" y2="48" stroke="#88d6ff" stroke-opacity=".16"/>
    <text x="22" y="75" fill="#2ee9ff" font-size="10" font-weight="700" letter-spacing="2">STREAK CODE</text>
    <rect x="128" y="68" width="285" height="8" rx="4" fill="url(#bar)" filter="url(#glow-cyan)"/>
    <g transform="translate(22 96)">
      <text x="0" y="106" fill="url(#number)" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="118" font-weight="800" letter-spacing="-10">47</text>
      <text x="0" y="135" fill="#e8f4ff" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="17" font-weight="700">day record streak</text>
      <text x="0" y="157" fill="#8ea0b8" font-size="11">podle core stable · reactor online</text>
    </g>
    <g transform="translate(440 60)">
      <circle cx="0" cy="16" r="5" fill="#f6fbff" filter="url(#glow-cyan)"/>
      <rect x="-2" y="25" width="4" height="172" rx="2" fill="url(#beam)" filter="url(#glow-cyan)"/>
      <circle cx="0" cy="206" r="5" fill="#f6fbff" filter="url(#glow-cyan)"/>
    </g>
    <g transform="translate(466 64)">
      <rect width="372" height="214" rx="10" fill="url(#hatch)" stroke="#ffb347" stroke-opacity=".55" stroke-dasharray="5 5"/>
      <path d="M0 14V0h14M358 0h14v14M0 200v14h14M372 200v14h-14" fill="none" stroke="#ffb347" stroke-width="2"/>
      <text x="18" y="34" fill="#ffd6a0" font-size="10" font-weight="700" letter-spacing="2">PODLE BAY</text>
      <text x="18" y="93" fill="#ffb347" font-size="25" font-weight="700" letter-spacing="3">HELD OPEN</text>
      <text x="18" y="123" fill="#ffd6a0" fill-opacity=".75" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="14">Empty on purpose.</text>
      <text x="18" y="145" fill="#ffd6a0" fill-opacity=".68" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="14">Future Podle module docks here.</text>
    </g>
    <line x1="22" y1="298" x2="838" y2="298" stroke="#88d6ff" stroke-opacity=".14"/>
    <text x="22" y="321" fill="#8ea0b8" font-size="10" font-weight="700" letter-spacing="2">PODLE WEEK</text>
    <g transform="translate(22 338)" font-size="10" font-weight="700" text-anchor="middle">
      <g fill="#2ee9ff"><rect x="0" y="-8" width="90" height="8" rx="2"/><rect x="121" y="-12" width="90" height="12" rx="2"/><rect x="242" y="-17" width="90" height="17" rx="2"/><rect x="363" y="-24" width="90" height="24" rx="2"/><rect x="484" y="-17" width="90" height="17" rx="2"/><rect x="605" y="-11" width="90" height="11" rx="2"/><rect x="726" y="-7" width="90" height="7" rx="2"/></g>
      <g fill="#e8f4ff"><text x="45" y="21">S</text><text x="166" y="21">M</text><text x="287" y="21">T</text><text x="408" y="21">W</text><text x="529" y="21">T</text><text x="650" y="21">F</text><text x="771" y="21">S</text></g>
    </g>
  </g>
</svg>
