<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">PodleHub PodleStreak and Podle Bay</title>
  <desc id="desc">PodleStreak shows 47 days of consecutive daily commits with PODLEWEEK activity bars beside a separate held-open Podle Bay panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070c"/><stop offset=".55" stop-color="#0b121c"/><stop offset="1" stop-color="#16091b"/></linearGradient>
    <linearGradient id="number" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".38" stop-color="#2ee9ff"/><stop offset=".68" stop-color="#ff2ec8"/><stop offset="1" stop-color="#ccff5e"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2ee9ff"/><stop offset=".55" stop-color="#ff2ec8"/><stop offset="1" stop-color="#ccff5e"/></linearGradient>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="16" height="16" fill="#171018"/><rect width="8" height="16" fill="#2c1d12" fill-opacity=".65"/></pattern>
    <filter id="cyan"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pink"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="860" height="430" rx="16" fill="url(#bg)" stroke="#263746"/>
  <rect x="1" y="1" width="858" height="428" rx="15" fill="none" stroke="#ff2ec8" stroke-opacity=".2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="25" cy="27" r="5" fill="#ff2ec8" filter="url(#pink)"/>
    <text x="41" y="31" fill="#e8f4ff" font-size="12" font-weight="800" letter-spacing="3">PODLEHUB</text>
    <text x="838" y="31" fill="#2ee9ff" font-size="11" font-weight="700" text-anchor="end" letter-spacing="2">PODLE REACTOR</text>
    <line x1="22" y1="50" x2="838" y2="50" stroke="#88d6ff" stroke-opacity=".18"/>
    <rect x="22" y="68" width="500" height="340" rx="14" fill="#080c13" stroke="#2ee9ff" stroke-opacity=".3"/>
    <rect x="548" y="68" width="290" height="340" rx="14" fill="url(#hatch)" stroke="#ffb347" stroke-opacity=".72" stroke-dasharray="6 5"/>
    <text x="42" y="98" fill="#2ee9ff" font-size="11" font-weight="800" letter-spacing="3">PODLESTREAK</text>
    <rect x="170" y="90" width="290" height="9" rx="4" fill="url(#rail)" filter="url(#cyan)"/>
    <text x="42" y="198" fill="url(#number)" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="94" font-weight="850" letter-spacing="-7">47 DAYS</text>
    <rect x="112" y="218" width="320" height="8" rx="4" fill="url(#rail)" filter="url(#cyan)"/>
    <text x="42" y="255" fill="#e8f4ff" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="18" font-weight="800">consecutive daily commit streak</text>
    <text x="42" y="277" fill="#9bb0c6" font-size="11" letter-spacing="1">PODLECORE stabilized</text>
    <line x1="42" y1="296" x2="502" y2="296" stroke="#88d6ff" stroke-opacity=".16"/>
    <text x="42" y="320" fill="#9fb3ca" font-size="11" font-weight="800" letter-spacing="3">PODLEWEEK</text>
    <g transform="translate(58 377)" text-anchor="middle" font-size="11" font-weight="800">
      <g fill="#2ee9ff" filter="url(#cyan)"><rect x="0" y="-25" width="44" height="25" rx="3"/><rect x="70" y="-38" width="44" height="38" rx="3"/><rect x="140" y="-20" width="44" height="20" rx="3"/><rect x="210" y="-52" width="44" height="52" rx="3"/><rect x="280" y="-31" width="44" height="31" rx="3"/><rect x="350" y="-64" width="44" height="64" rx="3"/></g>
      <rect x="420" y="-15" width="44" height="15" rx="3" fill="#2ee9ff" fill-opacity=".25"/>
      <g fill="#e8f4ff"><text x="22" y="20">S</text><text x="92" y="20">M</text><text x="162" y="20">T</text><text x="232" y="20">W</text><text x="302" y="20">T</text><text x="372" y="20">F</text><text x="442" y="20">S</text></g>
      <circle cx="232" cy="-59" r="3" fill="#ff2ec8"/>
    </g>
    <path d="M548 82h14M548 82v14M824 82h14M838 82v14M548 394h14M548 408v-14M824 408h14M838 408v-14" fill="none" stroke="#ffb347" stroke-width="2"/>
    <text x="570" y="102" fill="#ffd6a0" font-size="11" font-weight="800" letter-spacing="3">PODLE BAY</text>
    <text x="570" y="175" fill="#ffb347" font-size="25" font-weight="800" letter-spacing="3">HELD OPEN</text>
    <text x="570" y="213" fill="#ffd6a0" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="15">Separate panel.</text>
    <text x="570" y="238" fill="#ffd6a0" fill-opacity=".72" font-family="Segoe UI, Helvetica Neue, sans-serif" font-size="14">Future module docks here.</text>
    <text x="570" y="373" fill="#ffd6a0" fill-opacity=".58" font-size="10" letter-spacing="2">STATUS / RESERVED</text>
  </g>
</svg>
