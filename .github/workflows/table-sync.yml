name: sync blackjack table

on:
  repository_dispatch:
    types: [table-sync]

permissions:
  contents: write

concurrency:
  group: blackjack-table
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: fetch authoritative state
        env:
          # Set BLACKJACK_WORKER_URL as a repository Variable, or as a Secret.
          WORKER_URL: ${{ vars.BLACKJACK_WORKER_URL || secrets.BLACKJACK_WORKER_URL }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${WORKER_URL//[[:space:]]/}" ]]; then
            echo "::error::BLACKJACK_WORKER_URL is not configured as a repository Variable or Secret"
            exit 1
          fi
          case "$WORKER_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::BLACKJACK_WORKER_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          state_tmp="$(mktemp)"
          trap 'rm -f "$state_tmp"' EXIT
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'Accept: application/json' \
            "${WORKER_URL%/}/state" \
            --output "$state_tmp"

          python3 - "$state_tmp" <<'PY'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          source = Path(sys.argv[1])
          try:
              with source.open(encoding="utf-8") as handle:
                  state = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid Worker /state response: {exc}") from exc

          required = {
              "phase", "deck", "player", "dealer", "msg", "balance",
              "session", "ledger", "stats",
          }
          if not isinstance(state, dict):
              raise SystemExit("Worker /state response must be a JSON object")
          missing = sorted(required.difference(state))
          if missing:
              raise SystemExit(f"Worker /state response is missing keys: {', '.join(missing)}")

          target = Path("game/state.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          fd, temporary = tempfile.mkstemp(prefix=".state-", dir=target.parent)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  json.dump(state, handle, indent=2, ensure_ascii=False)
                  handle.write("\n")
              os.replace(temporary, target)
          except BaseException:
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
              raise
          PY

      - name: regenerate SVG assets without applying a move
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/blackjack.py")
          spec = importlib.util.spec_from_file_location("blackjack_renderer", path)
          if spec is None or spec.loader is None:
              raise SystemExit(f"could not load renderer: {path}")
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)

          # load() reads the fetched state; these renderer calls do not apply a move.
          state = renderer.load()
          Path("assets/blackjack.svg").write_text(
              renderer.render_table(state), encoding="utf-8"
          )
          renderer.render_buttons(state)
          PY

      - name: commit changed table files
        run: |
          set -Eeuo pipefail
          git config user.name "blackjack-dealer[bot]"
          git config user.email "actions@github.com"
          git add \
            assets/blackjack.svg \
            assets/btn_play.svg \
            assets/btn_hit.svg \
            assets/btn_stand.svg \
            game/state.json

          if git diff --cached --quiet; then
            echo "Table state and rendered assets are unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "sync blackjack table state [skip ci]"
          git push origin HEAD:main
