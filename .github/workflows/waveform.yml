name: profile-assets

on:
  schedule:
    - cron: "17 */8 * * *" # Refresh three times per day.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate generator
        run: python3 -m unittest discover -s tests -v

      - name: Require private-repository activity token
        env:
          GH_TOKEN: ${{ secrets.WAVEFORM_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WAVEFORM_TOKEN is required for an accurate all-repository commit streak. Configure a token with read access to every owned repository."
            exit 1
          fi

      - name: Render current profile assets
        env:
          GH_TOKEN: ${{ secrets.WAVEFORM_TOKEN }}
          GH_USER: podledges
        run: python3 scripts/waveform.py

      - name: Commit refreshed assets
        run: |
          git config user.name "profile-assets[bot]"
          git config user.email "actions@github.com"
          git add assets/podle-reactor.svg assets/waveform.svg
          git diff --cached --quiet && exit 0
          git commit -m "🎚 refresh profile activity [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
